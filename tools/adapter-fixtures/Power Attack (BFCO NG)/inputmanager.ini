; fixture for Unbind Vanilla Controls' "Power Attack (BFCO NG)" row - the Input Manager actions it drives
; Input Manager (Nexus 174545, GitHub vinymayan/Input-Manager): GetActionInfo / UpdateActionMappingV2; a PC key is
;   the SKSE code, a gamepad key is the controller mask + 266, 0 = no key on both
; source: BFCO NG (GitHub vinymayan/BFCO, branch ng, src/Settings.cpp): SETTINGS_PATH Data/SKSE/Plugins/BFCO NG/Settings.json,
;   WriteJSON/ReadJSON "PowerAttackActionIDs" - the Input Manager action ids the player picked for its power attack
[Actions]
actions = ids=SKSE\Plugins\BFCO NG\Settings.json:PowerAttackActionIDs
requires = BFCO NG.esp
