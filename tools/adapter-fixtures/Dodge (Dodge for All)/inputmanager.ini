; fixture for Unbind Vanilla Controls' "Dodge (Dodge for All)" row - the Input Manager actions it drives
; Input Manager (Nexus 174545, GitHub vinymayan/Input-Manager): GetActionInfo / UpdateActionMappingV2; a PC key is
;   the SKSE code, a gamepad key is the controller mask + 266, 0 = no key on both
; source: Dodge for all (Nexus 174544, GitHub vinymayan/Dodge): finds or creates its actions by name - 'Dodge Step',
;   'Dodge Roll', 'Dash' (default: X tapped once / twice, Left Shift + X); DLL SKSE\Plugins\DodgeAll.dll
[Actions]
actions = Dodge Step,Dodge Roll,Dash
requires = SKSE\Plugins\DodgeAll.dll
