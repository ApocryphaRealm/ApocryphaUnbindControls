[SystemMenu]
; The rows of the journal's System tab: 1 = the row is shown, 0 = it is hidden. A hidden row keeps working for
; everything else - the list just skips it, and stays centred.
; Works with the game's own journal and journals built on it. Quest Journal Overhaul - Entire Journal Redesigned hides
; its System rows from its own MCM settings, so this section leaves that journal alone.
; Creations appears when the game offers Creations.
;
; Shipped: Quicksave, Installed Content, Creations and Help hidden.
