[Bound]
; One control per line: Context|Control|Device|Button[|Modifier]. That control GETS that key or button - even one the game
; gives no button on that device and its Controls menu cannot remap there (System Tab has no controller button).
; Button: a controller name - A, B, X, Y, LB, RB, LT, RT, Start, Back, LeftStick, RightStick, DPadUp, DPadDown,
; DPadLeft, DPadRight - or a code in hex, such as 0x0010. A key another control already holds on that device is not
; taken; the log names the control that holds it. Delete a line, or put ; in front of it, to drop that bind.
; A key you give a control in the game's Controls menu is written here (bKeepRemapsInIni=1); setting it back to
; the game's own key removes its line.
;
;
; Modifier (optional, the fifth field): a second key or button that must be HELD DOWN for the control to fire.
; Write the word Modifier here instead of a button to use the designated modifier row above - then moving that
; row moves this combination too. Example: Gameplay|Shout|gamepad|LB|Modifier is "the modifier, then LB".
; Same vocabulary as Button - a controller name or a hex code. Leave it off, or leave it empty, for no modifier.
; The game itself understands this: controlmap.txt writes the same thing as "0x0009+0x0100", and the engine matches
; the key and the modifier together, which is how a layout can put two functions on one button. A control bound with
; a modifier does nothing on its own - only the combination fires it.
; Examples: Gameplay|Shout|gamepad|Y|LT     (LT held, then Y)
;           Gameplay|Favorites|keyboard|0x10|0x2a   (Left Shift held, then Q)
;
; Shipped (the author's own controller layout): System Tab (the game's Pause control) on Start, where Journal was;
; Tween Menu on Back; Shout on RT; Right Attack/Block on RB and Left Attack/Block on LB; Sprint on B; Toggle POV on
; D-pad up; Favorites on D-pad down. The game gives Favorites BOTH D-pad up and down and lets nothing else take either,
; so the Favorites line gives it D-pad down alone, which frees D-pad up for Toggle POV. A line gives a control that one
; button only: Gameplay|Favorites|gamepad|DPadUp puts Favorites on D-pad up and nothing else.
Gameplay|Pause|gamepad|Start
Gameplay|Tween Menu|gamepad|Back
Gameplay|Shout|gamepad|RT
Gameplay|Right Attack/Block|gamepad|RB
Gameplay|Left Attack/Block|gamepad|LB
Gameplay|Sprint|gamepad|B
Gameplay|Toggle POV|gamepad|DPadUp
Gameplay|Favorites|gamepad|DPadDown

[Modifier]
; The ONE button that a [Bound] line means when it writes "Modifier" in its modifier field, per device.
;
; It appears on the game's Controls page as a row called "Modifier", so you set it there like any other
; control - press its own button again to clear it. Every combination that refers to it moves at the same
; time, which is the point: you change the modifier in ONE place rather than editing each line.
;
; One device per line: Device|Button. Leave the button empty for a device with no modifier.
;
; Shipped: Left Trigger on the controller.
gamepad|LT
keyboard|
mouse|

[Remappable]
; Controls the GAME will not let you rebind on a device, forced remappable so their rows appear on its own
; Controls page.
;
; Skyrim's controlmap.txt carries a "can this be remapped" flag PER DEVICE, and the Controls page lists only the
; controls whose flag is set for the device it is showing. Both the vanilla control map and Apostasy's clear it on
; the CONTROLLER for the attack controls - so on a gamepad there is no Left Attack/Block or Right Attack/Block row
; at all (the normal attack, either hand), no way to rebind them there, and the game answers "That button is
; reserved." if you try to give one of their buttons to anything else.
;
; Listing a control here sets that flag while you play. The game then does the rest itself: it lists the control,
; names it, draws its button art and runs its own remap - and this mod records the result in this file like any
; other change. Nothing on disk in the game is touched.
;
; One control per line: Context|Control|Device - the same form as [Unbound].
;
; Shipped: the attack controls and Favorites on the controller (the game gives Favorites no row on the controller page).
Gameplay|Right Attack/Block|gamepad
Gameplay|Left Attack/Block|gamepad
Gameplay|Favorites|gamepad

[Functions]
; EXTRA ROWS on the game's Controls page, for functions the game itself has no control for.
; This mod does not add the function - another mod already does that, and keeps doing it. What it adds is the
; BINDING: a row you can see, bind and unbind on the Controls page like any vanilla control, whose button is
; handed to that mod's own settings file. One Click Power Attack is the shipped case: it already fires the power
; attack and already reads a key and a modifier, and the only thing it had no place for was setting them where a
; player looks. A separate row for a NORMAL attack is not needed - Right Attack/Block is already on that page.
;
; One row per line:
;   Name|Device|Button|Modifier|File|Section|Key|ModifierKey|NoKeyValue|GamepadSection|RequiresFile|Options
;
; Name        the row's text on the Controls page.
; Device      keyboard, mouse or gamepad - the device the button below belongs to. Leave empty for a row that is
;             not bound yet; the row still appears, with no key, ready to be bound in the Controls menu.
; Button      the button or key, by name (A, B, X, Y, LB, RB, LT, RT, Start, Back, Left Shift ...) or as a code
;             (0x2a). Leave empty for an unbound row.
; Modifier    optional: a second button that must be HELD DOWN for the function to fire. Leave empty for none.
; File        the file the button is written into, relative to Data. For a mod that uses MCM Helper this is
;             MCM\Settings\<mod>.ini - the file that holds YOUR chosen values, which the mod reads over its
;             own shipped defaults.
; Section     the section inside that file, e.g. General.
; Key         the setting that takes the button, e.g. iKeycode.
; ModifierKey optional: the setting that takes the modifier, e.g. iModifierKey. Leave empty if the target mod
;             has no modifier setting.
; GamepadSection optional (the tenth field): for a mod that keeps a SEPARATE key per device rather than one
;             key in the shared numbering. Wheeler does - [InputBindings.MKB] for keyboard and mouse,
;             [InputBindings.GamePad] for the controller - so Section above is the keyboard one and this is
;             the gamepad one. The two are independent: what you bind on the gamepad Controls page goes to
;             the gamepad section and leaves the keyboard binding alone, and the other way round.
; RequiresFile optional (the eleventh field): a file, relative to Data, whose presence means the target
;             MOD IS INSTALLED. A row whose mod is not there is NOT SHOWN on the Controls page and writes
;             nothing at all - so this mod is safe to install whether or not you have the mods its rows
;             point at. Defaults to the target file itself.
; NoKeyValue  optional: what the TARGET writes to mean "no key". Mods differ - One Click Power Attack uses -1,
;             Stances NG uses 0 - so it belongs to the target, not to this mod. Defaults to -1.
; Options     optional (the twelfth field), separated by ';':
;               padfirst    the target keeps ONE key for every device and the controller binding takes it when
;                           both are bound (True Directional Movement's uTargetLockKey).
;               padswitch=Section:Key=Bound/Unbound   a second setting written with the key: Bound while the row
;                           has a controller button, Unbound while it has none.
;               switch=Section:Key=Bound/Unbound      the same, for a binding on any device.
;               defaults=File   where the mod keeps its value while File above does not hold it (read only, to
;                           show the key in force). MCM Helper mods need none: their defaults are found by name.
;               api=InputManager   the key is an Input Manager action, set through Input Manager itself: File is
;                           SKSE\Plugins\InputManager.dll, Section is empty, and Key names the actions BY NAME -
;                           "Dodge Step,Dodge Roll,Dash". The first action is the row's; the others follow it while
;                           they share its key. Never by number: Input Manager numbers its actions by position, and
;                           the numbers move when a mod adds actions.
;               idcheck=JSON file:array   a mod that saves the numbers of the actions it listens to (BFCO NG's
;                           Settings.json:PowerAttackActionIDs): the log says when its first number no longer names
;                           this row's action, so you know to pick it again in that mod's own menu.
;
; The button is written in the numbering every SKSE mod's settings use: 0-255 keyboard, 256-263 mouse buttons,
; 266-281 gamepad buttons, and -1 for no key. You do not have to work any of that out - bind the row in the
; Controls menu and it is written for you, here and in the target file.
;
; Bind a row the way you bind any other: open Journal > System > Controls, select the row, press the button.
; Press the button it already has to unbind it, exactly like a vanilla control.
;
; Delete a line to remove that row from the Controls page.
;
; Shipped: Power Attack (One Click Power Attack), one Stance row, which drives Stances NG's cycling key
; (bUseCycling) so a single button steps through the stances, Wheel Menu (Perfected Wheeler / Wheeler) and Back Pocket
; (Back Pocket for Controller: the keyboard key that pockets the selected item, and an optional controller button for
; the same - holding Y stays the controller's own way). Back Pocket keeps both keys in [input] under different names,
; so its GamepadSection field is written "input:controller_toggle_item_key_code". All UNBOUND - a row that arrived
; holding a button would take that button away from whatever you have on it. They do not stay empty, though: at the
; first load a row with no button of its own ADOPTS whatever key that mod is already set to, so the Controls page
; shows what is really in force and nothing you had configured is overwritten. From then on the Controls page wins -
; the key you set there is written into that mod's settings.
;
; A row whose target mod is not installed is not shown and writes nothing; delete the line to remove the row.
;
; BUILT-IN ROWS (1.2.0): Call Horse, Dodge, Power Attack and Target Lock, one row for each mod below, named after it -
; "Call Horse (Simplest Horses)". They are part of the mod: each shows only while its mod is installed, and a line for
; one is added here at load if it is missing (unless another row of yours already sets that same mod setting).
;   Call Horse   Simplest Horses (hold the key to call, tap: follow / wait), Press H to Horse
;   Dodge        TK Dodge RE and TK Dodge NG, TK Dodge RE Addon, TK Dodge AIO, Dodge - MCO (DMCO: binding a key turns
;                its "dodge on Sprint" off; clearing the row turns it back on), Dodge for All (through Input Manager:
;                the step's key, and the roll and dash with it while they share it)
;   Power Attack One Click Power Attack (the Power Attack row above), BFCO, BFCO NG (through Input Manager: its
;                "Power Attack" action - pick that one as the power attack in BFCO NG's own menu), Simple Power Attack (three rows: Power
;                Attack, Left Power Attack, Dual Power Attack - each with its modifier)
;   Target Lock  True Directional Movement, and its Target Lock Extension by staalo18 (a controller button bound here
;                also stops the lock following Toggle POV; clear it to give the lock back to Toggle POV), Simple Lock-On
; A mod uses the new key once it reads its settings again: One Click Power Attack when the Journal closes, True
; Directional Movement and DodgeFramework when their own MCM page closes, Input Manager's actions (BFCO NG, Dodge for
; All) at once, Simple Power Attack AT THE NEXT GAME START (it reads its INI only when the game starts - and its own
; "Save to INI" button writes back the keys it started with), the others at the next game load.
; Mods that keep their key in the SAVE (the original TK Dodge SE, The Ultimate Dodge Mod, Simple Horse) have no file to
; write, so they have no row. Immersive Horses keeps its hotkeys in a JSON file but reads them only once per save, when
; its menu first starts (new games), so a key written there would not reach the game you are playing - no row either.
