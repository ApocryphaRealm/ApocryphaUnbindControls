[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2

[General]

; 1 = every control listed under [Unbound] has no key while you play. 0 = the list is ignored and every
; control keeps the key the game gives it.
bEnabled=1

; 1 = a control you change in the game's Controls menu is written into this file's [Unbound] and [Bound] lists,
; and the ControlMap_Custom.txt the game writes into its own folder is folded into this file and removed. Your
; controls then live only here, inside this mod (MO2 keeps this file in the mod's folder, so nothing lands in
; overwrite). 0 = the game keeps its own ControlMap_Custom.txt, as it does without this mod.
bKeepRemapsInIni=1

[Unbound]
; One control per line: Context|Control|Device. That control gets NO key on that device - pressing the
; key it had does nothing. Delete a line (or put ; in front of it) and the control has its key again the
; next time you start the game.
;
; Device: keyboard, mouse or gamepad.
; Context: Gameplay, Menu Mode, Console, Item Menus, Inventory, Favorites, Map, Stats, Cursor, Book, Journal,
;          Lockpicking, Favor (and Debug Text, Debug Overlay, TFC, Debug Map).
; Control: the name in the game's Interface\Controls\PC\controlmap.txt, for example Sneak, Jump, Sprint,
;          Shout, Toggle POV, Ready Weapon, Favorites, Hotkey1 ... Hotkey8, Quicksave, Quickload.
;
; Shipped list (the author's own): Journal, Quick Inventory, Quick Magic, Quick Map, Quick Stats, Wait, Quicksave,
; Quickload, Auto-Move and Toggle Always Run on the keyboard, and Wait (Back) and Journal (Start) on the controller -
; Start opens the System tab instead (see [Bound]). Favorites stays bound: Q on the keyboard, and D-pad down on the
; controller, because D-pad up is Toggle POV's (see [Bound]). Every other control keeps its key. A menu action the game
; links to an unbound control keeps that key. You can also unbind a control in the game's Controls menu by pressing the
; key it already has; it is added here. A control the Controls menu leaves with no key is added here too
; (bKeepRemapsInIni=1), and its row stays on the Controls page with no key, so you can always bind it again.
;
; Optional - the author's Wheeler setup. If you open Wheeler on Q or on the D-pad instead of the Favorites menu, unbind
; Favorites: remove the ; in front of the two lines below, and put a ; in front of Gameplay|Favorites|gamepad|DPadDown
; in [Bound] (a [Bound] line wins over an [Unbound] one). The Favorites menu then has no key on either device.
;Gameplay|Favorites|keyboard
;Gameplay|Favorites|gamepad
