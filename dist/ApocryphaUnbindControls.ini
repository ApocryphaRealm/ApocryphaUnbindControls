[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; 1 = every control listed under [Unbound] has no key while you play. 0 = the list is ignored and every
; control keeps the key the game gives it.
bEnabled=1

; 1 = a control you change in the game's Controls menu is written into this file's [Unbound] and [Bound] lists,
; and the ControlMap_Custom.txt the game writes into its own folder is folded into this file and removed. Your
; controls then live only here, inside this mod (MO2 keeps this file in the mod's folder, so nothing lands in
; overwrite). 0 = the game keeps its own ControlMap_Custom.txt, as it does without this mod.
bKeepRemapsInIni=1

[Unbound]
; One control per line: Context|Control|Device. That control gets NO key on that device - pressing the
; key it had does nothing. Delete a line (or put ; in front of it) and the control has its key again the
; next time you start the game.
;
; Device: keyboard, mouse or gamepad.
; Context: Gameplay, Menu Mode, Console, Item Menus, Inventory, Favorites, Map, Stats, Cursor, Book, Journal,
;          Lockpicking, Favor (and Debug Text, Debug Overlay, TFC, Debug Map).
; Control: the name in the game's Interface\Controls\PC\controlmap.txt, for example Sneak, Jump, Sprint,
;          Shout, Toggle POV, Ready Weapon, Favorites, Hotkey1 ... Hotkey8, Quicksave, Quickload.
;
; Shipped list (the author's own): Journal, Quick Inventory, Quick Magic, Quick Map, Quick Stats, Wait, Favorites,
; Quicksave, Quickload, Auto-Move and Toggle Always Run on the keyboard, and Wait (Back) and Journal (Start) on the
; controller - Start opens the System tab instead (see [Bound]). Every other control keeps its key. A menu action the
; game links to an unbound control keeps that key. You can also unbind a control in the game's Controls menu by pressing
; the key it already has; it is added here. A control the Controls menu leaves with no key is added here too
; (bKeepRemapsInIni=1).
Gameplay|Journal|keyboard
Gameplay|Quick Inventory|keyboard
Gameplay|Quick Magic|keyboard
Gameplay|Quick Map|keyboard
Gameplay|Quick Stats|keyboard
Gameplay|Wait|keyboard
Gameplay|Wait|gamepad
Gameplay|Journal|gamepad
Gameplay|Favorites|keyboard
Gameplay|Quicksave|keyboard
Gameplay|Quickload|keyboard
Gameplay|Auto-Move|keyboard
Gameplay|Toggle Always Run|keyboard

[Bound]
; One control per line: Context|Control|Device|Button[|Modifier]. That control GETS that key or button - even one the game
; gives no button on that device and its Controls menu cannot remap there (System Tab has no controller button).
; Button: a controller name - A, B, X, Y, LB, RB, LT, RT, Start, Back, LeftStick, RightStick, DPadUp, DPadDown,
; DPadLeft, DPadRight - or a code in hex, such as 0x0010. A key another control already holds on that device is not
; taken; the log names the control that holds it. Delete a line, or put ; in front of it, to drop that bind.
; A key you give a control in the game's Controls menu is written here (bKeepRemapsInIni=1); setting it back to
; the game's own key removes its line.
;
;
; Modifier (optional, the fifth field): a second key or button that must be HELD DOWN for the control to fire.
; Same vocabulary as Button - a controller name or a hex code. Leave it off, or leave it empty, for no modifier.
; The game itself understands this: controlmap.txt writes the same thing as "0x0009+0x0100", and the engine matches
; the key and the modifier together, which is how a layout can put two functions on one button. A control bound with
; a modifier does nothing on its own - only the combination fires it.
; Examples: Gameplay|Shout|gamepad|Y|LT     (LT held, then Y)
;           Gameplay|Favorites|keyboard|0x10|0x2a   (Left Shift held, then Q)
;
; Shipped: System Tab (the game's Pause control) on the controller's Start button, where Journal was.
Gameplay|Pause|gamepad|Start

[SystemMenu]
; The rows of the journal's System tab: 1 = the row is shown, 0 = it is hidden. A hidden row keeps working for
; everything else - the list just skips it, and stays centred.
; Works with the game's own journal and journals built on it. Quest Journal Overhaul - Entire Journal Redesigned hides
; its System rows from its own MCM settings, so this section leaves that journal alone.
; Creations appears when the game offers Creations.
;
; Shipped: Quicksave, Installed Content, Creations and Help hidden.
Quicksave=0
Save=1
Load=1
Installed Content=0
Creations=0
Settings=1
Mod Configuration=1
Controls=1
Help=0
Quit=1
