[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; 1 = the controls listed under [Unbound] are unbound in the running game. 0 = every control keeps
; the key the game gives it; the list below is kept but not applied.
bEnabled=1

[Unbound]
; One line per control this mod leaves without a key, written by the settings page as you switch
; controls off. Context|Control|Device = the key(s) the game had there, remembered so the control
; can be given back its key later (key/modifier pairs, hexadecimal, comma-separated when a control
; holds several keys on one device). An empty value means the key the game has there when it starts.
; Devices: keyboard, mouse, gamepad. Context and control names are the ones in the game's controlmap.txt.
;
; Shipped list: the keyboard shortcuts for screens the Tween Menu already opens (Tween Menu Overhaul
; with its Wait add-on offers Inventory, Magic, Map, Quests, Skills and Wait). The Tween Menu key stays.
Gameplay|Journal|keyboard=
Gameplay|Quick Inventory|keyboard=
Gameplay|Quick Magic|keyboard=
Gameplay|Quick Map|keyboard=
Gameplay|Quick Stats|keyboard=
Gameplay|Wait|keyboard=
