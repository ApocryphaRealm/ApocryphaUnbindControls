[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; 1 = every control listed under [Unbound] has no key while you play. 0 = the list is ignored and every
; control keeps the key the game gives it.
bEnabled=1

[Unbound]
; One control per line: Context|Control|Device. That control gets NO key on that device - pressing the
; key it had does nothing. Delete a line (or put ; in front of it) and the control has its key again the
; next time you start the game.
;
; Device: keyboard, mouse or gamepad.
; Context: Gameplay, Menu Mode, Console, Item Menus, Inventory, Favorites, Map, Stats, Cursor, Book, Journal,
;          Lockpicking, Favor (and Debug Text, Debug Overlay, TFC, Debug Map).
; Control: the name in the game's Interface\Controls\PC\controlmap.txt, for example Sneak, Jump, Sprint,
;          Shout, Toggle POV, Ready Weapon, Favorites, Hotkey1 ... Hotkey8, Quicksave, Quickload.
;
; Shipped list: the keyboard shortcuts for screens the Tween Menu already opens (Tween Menu Overhaul with its
; Wait add-on offers Inventory, Magic, Map, Quests, Skills and Wait). The Tween Menu key itself stays.
Gameplay|Journal|keyboard
Gameplay|Quick Inventory|keyboard
Gameplay|Quick Magic|keyboard
Gameplay|Quick Map|keyboard
Gameplay|Quick Stats|keyboard
Gameplay|Wait|keyboard
